name: Build ReportExportTool

on:
  push:
    branches: [ "main" ]
    paths:
      - 'report_export.py'
      - 'sign_tool.py'
      - 'config.json'
      - 'account.ini'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
          architecture: 'x86'

      - run: pip install pyinstaller requests openpyxl

      - run: pyinstaller --onefile --name "ReportExportTool" --noupx report_export.py

      - run: copy config.json dist\
      - run: copy users.json dist\
      - run: copy account.ini dist\

      - uses: actions/upload-artifact@v4
        with:
          name: ReportExportTool-Win32
          path: dist/
